# AradVision 配置文件
# 说明：修改配置后需重启应用生效

# ==================== 检测器配置 ====================
detector:
  # 检测器类型: mock（模拟）, yolo（真实YOLO）
  type: mock

  # YOLO 模型路径
  model_path: models/yolov8n_dnf.pt

  # 置信度阈值（0.0 - 1.0），低于此值的检测结果会被过滤
  confidence_threshold: 0.6

  # NMS（非极大值抑制）阈值（0.0 - 1.0）
  nms_threshold: 0.45

  # 输入图像尺寸 [width, height]
  input_size: [640, 640]

  # 是否使用 GPU 加速
  use_gpu: true

# ==================== 截图配置 ====================
capture:
  # 游戏窗口标题（用于查找窗口）- 更新为完整标题
  window_title: DNF Taiwan

  # 窗口类名（备用）
  window_class: D3D Window

  # 目标帧率（FPS）
  target_fps: 30

  # 捕获分辨率
  width: 1920
  height: 1080

  # 显示器索引（0=主显示器，1=第二显示器...）
  monitor_index: 1

  # 是否使用 Mock 捕获引擎（true=生成随机帧，false=真实截图）
  use_mock: false

  # 捕获后端:
  # auto = Windows 优先 WGC，失败降级 MSS；非 Windows 直接 MSS
  # wgc  = 强制优先 WGC（失败时按代码策略降级）
  # mss  = 强制使用 MSS 屏幕区域捕获
  backend: auto

  # WGC 选项：是否捕获鼠标光标
  wgc_show_cursor: false

  # WGC 选项：是否关闭系统捕获边框（库支持时生效）
  wgc_force_borderless: false

# ==================== 输入配置 ====================
input:
  # 输入驱动类型: mock（模拟）, real（真实硬件输入）
  type: real

  # 输入延迟范围（秒）- 用于反检测
  delay_min: 0.05
  delay_max: 0.15

  # 是否启用随机化（延迟、操作间隔等）
  randomization: true

  # 按键绑定配置
  key_bindings:
    # 移动（方向键）
    move_up: up         # 方向键上 ↑
    move_down: down      # 方向键下 ↓
    move_left: left      # 方向键左 ←
    move_right: right    # 方向键右 →

    # 动作
    attack: x            # 普通攻击
    skill: z             # 通用技能
    jump: c              # 跳跃
    pick_up: x           # 拾取物品（与攻击共用 x 键）

    # 技能栏
    skill_1: "1"
    skill_2: "2"
    skill_3: "3"
    skill_4: "4"
    skill_5: "5"
    skill_6: "6"
    skill_7: "7"
    skill_8: "8"

  # 窗口管理
  window:
    check_focus: true       # 是否检查窗口焦点
    auto_activate: true      # 自动激活游戏窗口到前台
    title: DNF           # 游戏窗口标题（用于查找）

# ==================== 战斗配置 ====================
combat:
  # Y轴对齐容差（像素）- DNF战斗需要Y轴对齐
  y_tolerance: 15

  # 攻击距离（像素）
  attack_range: 150

  # 移动速度倍率（1.0 = 正常速度）
  move_speed: 1.0

  # 攻击间隔（秒）
  attack_interval: 0.3

# ==================== 系统配置 ====================
system:
  # 调试模式（启用后输出详细日志）
  debug_mode: false

  # 日志级别: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

  # 是否启用调试覆盖层（显示检测框、FPS等）
  enable_overlay: false

  # 紧急停止按键
  kill_switch_key: F12
