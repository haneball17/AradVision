# AradVision 配置文件
# 说明：修改配置后需重启应用生效

# ==================== 检测器配置 ====================
detector:
  # 检测器类型: mock（模拟）, yolo（真实YOLO）
  type: mock

  # YOLO 模型路径
  model_path: models/yolov8n_dnf.pt

  # 置信度阈值（0.0 - 1.0），低于此值的检测结果会被过滤
  confidence_threshold: 0.6

  # NMS（非极大值抑制）阈值（0.0 - 1.0）
  nms_threshold: 0.45

  # 输入图像尺寸 [width, height]
  input_size: [640, 640]

  # 是否使用 GPU 加速
  use_gpu: true

# ==================== 截图配置 ====================
capture:
  # 游戏窗口标题（用于查找窗口）- 更新为完整标题
  window_title: DNF Taiwan

  # 窗口类名（备用）
  window_class: D3D Window

  # 目标帧率（FPS）
  target_fps: 30

  # 捕获分辨率（当前 ROI 默认基线为 960x720）
  width: 960
  height: 720

  # 显示器索引（0=主显示器，1=第二显示器...）
  monitor_index: 1

  # 是否使用 Mock 捕获引擎（true=生成随机帧，false=真实截图）
  use_mock: false

  # 捕获后端:
  # auto = Windows 优先 WGC，失败降级 MSS；非 Windows 直接 MSS
  # wgc  = 强制优先 WGC（失败时按代码策略降级）
  # mss  = 强制使用 MSS 屏幕区域捕获
  backend: auto

  # 捕获后端失败时是否允许降级（true: 例如 wgc 自动降级到 mss）
  # 调试 WGC 问题时建议设为 false，避免静默降级
  allow_fallback: false

  # WGC 选项：是否捕获鼠标光标
  wgc_show_cursor: false

  # WGC 选项：是否关闭系统捕获边框（库支持时生效）
  wgc_force_borderless: false

# ==================== 输入配置 ====================
input:
  # 输入驱动类型: mock（模拟）, real（真实硬件输入）
  type: real

  # 输入延迟范围（秒）- 用于反检测
  delay_min: 0.05
  delay_max: 0.15

  # 是否启用随机化（延迟、操作间隔等）
  randomization: true

  # 按键绑定配置
  key_bindings:
    # 移动（方向键）
    move_up: up         # 方向键上 ↑
    move_down: down      # 方向键下 ↓
    move_left: left      # 方向键左 ←
    move_right: right    # 方向键右 →

    # 动作
    attack: x            # 普通攻击
    skill: z             # 通用技能
    jump: c              # 跳跃
    pick_up: x           # 拾取物品（与攻击共用 x 键）

    # 技能栏
    skill_1: "1"
    skill_2: "2"
    skill_3: "3"
    skill_4: "4"
    skill_5: "5"
    skill_6: "6"
    skill_7: "7"
    skill_8: "8"

    # 药水栏
    potion_1: "1"
    potion_2: "2"

  # 窗口管理
  window:
    check_focus: true       # 是否检查窗口焦点
    auto_activate: true      # 自动激活游戏窗口到前台
    title: DNF           # 游戏窗口标题（用于查找）

# ==================== 战斗配置 ====================
combat:
  # Y轴对齐容差（像素）- DNF战斗需要Y轴对齐
  y_tolerance: 15

  # 攻击距离（像素）
  attack_range: 150

  # 移动速度倍率（1.0 = 正常速度）
  move_speed: 1.0

  # 攻击间隔（秒）
  attack_interval: 0.3

# ==================== 系统配置 ====================
system:
  # 调试模式（启用后输出详细日志）
  debug_mode: false

  # 日志级别: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

  # 是否启用调试覆盖层（显示检测框、FPS等）
  enable_overlay: false

  # 紧急停止按键
  kill_switch_key: F12

# ==================== 固定路线副本 MVP 配置 ====================
dungeon_run:
  # 当前主链路是否启用固定路线 MVP 管线
  enabled: true

  # 副本标识
  dungeon_id: jmzjz

  # 当前路线策略标签
  route_policy_tag: fixed_full_clear

  # 从第几个房间开始
  start_room_index: 1

  # 主画面状态识别
  main_view:
    # 以下 ROI 需要按你的实际分辨率和 HUD 重新标定
    transition_roi: [390, 300, 180, 120]
    clear_roi: [360, 95, 240, 90]
    boss_roi: [600, 0, 340, 80]
    finish_roi: [610, 520, 230, 120]

    # 首版使用固定 ROI + 颜色规则；模板匹配可后续按需补充
    transition_dark_threshold: 40.0
    clear_blue_ratio_threshold: 0.42
    boss_red_ratio_threshold: 0.42
    finish_green_ratio_threshold: 0.42
    stable_frames: 3

  # 小地图校验模块
  minimap:
    outer: [719, 39, 201, 110]
    inner: [742, 60, 132, 35]
    neighbor_roi: [740, 58, 155, 48]
    special_roi: [880, 58, 26, 26]
    resize_scale: 2
    dark_threshold: 55.0
    flash_brightness_threshold: 200.0
    boss_red_ratio_threshold: 0.44
    special_green_ratio_threshold: 0.44
    stable_frames: 8
    pending_timeout_ms: 400

  # 固定 UI ROI
  ui_rois:
    hp_bar: [31, 680, 145, 14]
    mp_bar: [784, 680, 145, 14]
    inventory_flag: [540, 58, 250, 24]
    inventory_weight_bar: [523, 546, 160, 20]
    vendor_flag: [84, 606, 372, 46]
    potion_flag: [130, 632, 48, 42]

  # 守护层阈值
  guard_thresholds:
    hp_critical_threshold: 0.25
    hp_low_threshold: 0.45
    mp_low_threshold: 0.20
    potion_cooldown_ms: 1200

  # 当前职业画像
  class_profile:
    name: map_wide_attack_current_class
    requires_mp: false
    primary_combat_skill: 1
    combat_interval_ms: 450

  # 副本后维护流程
  maintenance:
    sell_dry_run: true
    sell_rarity_threshold: uncommon
    max_weight_ratio: 0.85
    min_free_slots: 8
    min_potion_stock: 3

  # 固定路线房间脚本
  # 注意：这里先提供结构示例，真实《歼灭追击战》路线需要按实测逐房间补齐
  room_scripts:
    - room_idx: 1
      room_type: normal
      expected_exit_direction: RIGHT
      exit_action_template: move_right_hold_1200
      door_confirmation_roi: [640, 220, 180, 180]
      transition_timeout_ms: 1800
      is_last_normal_room: false
      route_policy_tag: fixed_full_clear
      room_feature_tag: normal
      next_step: go_next_normal

    - room_idx: 2
      room_type: boss
      expected_exit_direction: STOP
      exit_action_template: none
      door_confirmation_roi: [640, 220, 180, 180]
      transition_timeout_ms: 1800
      is_last_normal_room: false
      route_policy_tag: fixed_full_clear
      room_feature_tag: boss
      next_step: stop_after_finish
